net(){const m=N.mode,pills=(o,k)=>`<div style="padding:0 16px"><button class="gh w" data-a="${k}dir" style="text-align:left;margin:4px 0">${o.sf?'🔷 '+esc(o.sf.name):'🔷 Любое направление'}${o.sf?'<span style="float:right" data-a="clr'+k+'">✕</span>':''}</button></div>`,cp=o=>`<div style="padding:0 16px"><button class="gh w" data-a="${o}cc" style="text-align:left;margin:8px 0">🌐 ${CC[N.cc]}${N.cc?'<span style="float:right" data-a="clrcc">✕</span>':''}</button></div>`;let f='';
 const dirP=`<div style="padding:0 16px"><button class="gh w" data-a="ndir" style="text-align:left;margin:4px 0;color:var(--pr)">🔷 ${N.sf?esc(N.sf.name):'Любое направление'}${N.sf?'<span style="float:right" data-a="clrsf">✕</span>':''}</button></div>`;
 if(m==='topic')f=`<div class="p h">Найдите ведущих исследователей по направлению, ключевым словам и стране. Рейтинг строится по числу работ в открытой базе OpenAlex.</div>${dirP}<div class="sb" style="margin:8px 16px;border-radius:16px"><span>🔍</span><input id="kw" placeholder="Ключевые слова (необязательно)" value="${esc(N.kw)}"></div>${cp('n')}<div class="row sp" style="padding:8px 16px"><span>Только активные за последние 5 лет</span><input type="checkbox" class="sw" id="act" ${N.act?'checked':''}></div><div style="padding:0 16px"><button data-a="netgo" class="w" style="padding:15px" ${N.busy?'disabled':''}>🔍 Найти</button></div>`;
 else if(m==='name')f=`<div class="sb"><span>🔍</span><input id="nm" placeholder="Имя учёного" value="${esc(N.name)}"><button data-a="netgo">→</button></div>`;
 else f=`<div class="p h">Учёные, опубликовавшие профиль в Scinode</div>${dirP}${cp('n')}${S.pub?`<div class="card" data-a="mine"><div class="row"><div class="av">${esc((S.name||'?').slice(0,2).toUpperCase())}</div><div><div class="t">${esc(S.name)}</div><div class="m">${esc([S.status,S.aff,CC[S.country]||S.country].filter(Boolean).join(' · '))}</div></div></div><div>${(S.dirs||[]).map(d=>`<span class="tag">${esc(d.name)}</span>`).join('')}</div><div class="h" style="margin-top:6px">Это вы</div></div>`:'<div class="empty">Профили других участников подтягиваются с сервера сообщества. Ваш профиль можно опубликовать в «Профиль → Мой профиль учёного».</div>'}`;
 return stabs('net')+`<div class="seg">${[['topic','По теме'],['name','По имени'],['sci','В Scinode']].map(x=>`<button class="${m===x[0]?'on':''}" data-a="nmode" data-m="${x[0]}">${x[1]}</button>`).join('')}</div>${f}<div id="nres">${netHtml()}</div>`},

jr:()=>(setTimeout(()=>{if(cur==='jr'&&!J.items&&!J.busy&&J.m==='find')jGo()},0),'')+stabs('jr')+`<div class="seg"><button class="${J.m==='find'?'on':''}" data-a="jm" data-m="find">Найти журнал</button><button class="${J.m==='send'?'on':''}" data-a="jm" data-m="send">Куда отправить</button></div><div class="sb"><span>🔍</span><input id="jq" type="search" placeholder="${J.m==='find'?'Название или тема (пусто — все журналы)':'Тема или название вашей статьи…'}" value="${esc(J.q)}" enterkeyhint="search"><button data-a="jgo">→</button></div>${J.m==='find'?`<div class="chips"><button class="chip ${J.uz?'on':''}" data-a="juz">Узбекские</button><button class="chip ${J.doaj?'on':''}" data-a="jdoaj">В DOAJ</button></div>`:''}<div id="jres">${jrHtml()}</div>`,
msg:()=>`<div class="p"><h1>Сообщения</h1></div><div class="empty"><div class="ic">💬</div><h2 style="color:var(--tx)">Сообщений пока нет</h2>Диалоги с коллегами появятся здесь. Найдите учёного в разделе «Учёные».<br><br><button data-a="go" data-v="net">👥 Найти учёных</button></div>`,
proj(){const hd=(ttl,bk)=>`<div class="row sp" style="padding:12px 16px"><div class="row"><button class="x" data-a="${bk}" style="font-size:24px;color:var(--tx)">←</button><h2 style="margin:0 0 0 8px;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw">${ttl}</h2></div></div>`;
 if(curP){const b=PR.find(x=>x.id===curP);if(!b){curP=null;return V.proj()}
  return hdB(b)+`<div class="dots" id="dots">${b.cols.map((c,i)=>`<i class="${i===pi?'on':''}"></i>`).join('')}</div><div class="kb" id="kb">${b.cols.map((c,ci)=>{const l=b.tasks.filter(x=>x.col===ci&&(!PF||x.due));return `<div class="kc"><div class="row sp" style="margin-bottom:6px"><b>${esc(c)}</b><span class="row"><span class="tag" style="margin:0">${l.length}</span><button class="x" data-a="ccol" data-c="${ci}">⋮</button></span></div><div class="tl">${l.map(x=>{const d=dleft(x.due);return `<div class="kt"><div data-a="tedit" data-id="${x.id}">${esc(x.t)}${x.due?`<div><span class="tag ${d<0?'r':'g'}">📅 ${d<0?'Просрочено':d===0?'Сегодня':'Через '+d+' дн.'}</span></div>`:''}</div>${ci<LASTC(b)?`<button class="x" data-a="tmv" data-id="${x.id}" style="color:var(--pr)">→</button>`:'<span style="color:#2e9e5b">✓</span>'}</div>`}).join('')||'<div class="empty" style="padding:50px 10px">Перетащите сюда задачу или добавьте новую</div>'}</div><button class="ln" data-a="tadd" data-c="${ci}" style="margin-top:6px">＋ Добавить задачу</button></div>`}).join('')}</div>`}
 return hd('Проекты','home')+(PR.map(b=>{const dn=b.tasks.filter(x=>x.col===LASTC(b)).length,pc=b.tasks.length?Math.round(dn/b.tasks.length*100):0;return `<div class="item" data-a="openp" data-id="${b.id}"><div class="ic" style="background:#cdeadf">${b.type==='grant'?'💰':'📋'}</div><div><b>${esc(b.name)}</b><div style="height:5px;background:#cfcbd6;border-radius:3px;margin:6px 0"><div style="height:100%;width:${pc}%;background:#2e9e5b;border-radius:3px"></div></div><span class="h">Готово ${pc}% · Задач: ${b.tasks.length}</span></div><button class="x" data-a="rmp" data-id="${b.id}">⋮</button></div>`}).join('')||'<div class="empty">Создайте доску для статьи, гранта или диссертации.</div>')+'<button class="fab" data-a="newp">＋ Новая доска</button>'},
notes(){if(curN){const n=curN;return `<div class="row sp" style="padding:12px 16px"><div class="row"><button class="x" data-a="nback" style="font-size:24px;color:var(--tx)">←</button><h2 style="margin:0 0 0 8px;font-size:20px">${n.id?'Заметка':'Новая заметка'}</h2></div><div><button class="x" data-a="eye">👁</button>${n.id?'<button class="x" data-a="nmenu">⋮</button>':''}</div></div><div style="padding:0 16px 190px"><input id="nt" placeholder="Заголовок" value="${esc(n.t)}" style="font-size:22px;font-weight:700;background:none;padding-left:0">${prev?`<div class="pv" id="pv"></div>`:`<textarea id="nb" style="background:none;padding-left:0;min-height:55vh" placeholder="Текст заметки. Формула в строке: $E=mc^2$, отдельной строкой: $$…$$">${esc(n.b)}</textarea>`}</div><div class="tb"><div class="h" style="font-size:12px">${prev?'Режим просмотра: формулы показаны готовыми':'Нажмите кнопку с формулой ниже — она появится в тексте, а здесь будет видна готовой'}</div><div class="pv" id="lp" style="margin:6px 0">∑</div><div class="chips">${[['$ $','$|$'],['$$','$$\n|\n$$'],['a/b','\\frac{|}{}'],['xⁿ','^{|}'],['xᵢ','_{|}'],['√','\\sqrt{|}'],['∑','\\sum_{i=1}^{n}|'],['∫','\\int_{a}^{b}|'],['α','\\alpha|'],['π','\\pi|'],['≤','\\leq |'],['∞','\\infty|']].map(x=>`<button class="chip" data-a="ins" data-s="${esc(x[1])}">${esc(x[0])}</button>`).join('')}</div></div>`}
 return mtabs('notes')+`${NT.map(n=>`<div class="item" data-a="opn" data-id="${n.id}"><div class="ic">∑</div><div><b>${esc(n.t||'Без названия')}</b><div class="h" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(n.b)}</div></div></div>`).join('')||'<div class="empty"><div class="ic">∑</div><h2 style="color:var(--tx)">Пока нет заметок</h2>Записывайте выводы, идеи и формулы прямо с телефона. Формулы набираются кнопками над клавиатурой и сразу видны готовыми.</div>'}<button class="fab" data-a="newn">＋ Новая заметка</button>`},
map:()=>`<div id="map"></div><div class="mtop"><button class="rb" data-a="go" data-v="search">←</button><div class="pill">Карта науки</div></div><div class="mp"><button class="${M.cc?'on':''}" data-a="mcc">🌐 ${CC[M.cc]} ▾</button><button class="${M.sf?'on':''}" data-a="mdir">🔷 ${M.sf?esc(M.sf.name.slice(0,22)):'Любое направление'} ▾</button></div><div class="lg" id="lg"><div class="row sp"><b>Тип</b><span data-a="clg">✕</span></div>${Object.values(IT).map(x=>`<div><i style="background:${x[1]}"></i>${x[0]}</div>`).join('')}<div class="h" style="font-size:11px;margin-top:6px">Размер — число работ</div></div>`,
prof(){const pc=pcnt();return mtabs('prof')+`<div class="av big">${esc((S.name||'?')[0])}</div><h1 style="text-align:center;font-size:24px">${esc(S.name||'Без имени')}</h1><p class="h" style="text-align:center;font-size:15px">${tu&&tu.username?'@'+esc(tu.username):''}</p>
<div class="item" data-a="go" data-v="sci" style="margin-top:20px"><div class="ic">🪪</div><div><b>Мой профиль учёного</b><div style="height:6px;background:#cfcbd6;border-radius:3px;margin:6px 0"><div style="height:100%;width:${pc}%;background:var(--pr);border-radius:3px"></div></div><span class="h">${pc?'Заполнено: '+pc+'%':'Создайте профиль, чтобы вас находили коллеги'}</span></div>›</div>
<div style="padding:4px 16px"><b>Язык</b><div class="row" style="margin-top:8px">${[['uz','Oʻzbekcha'],['ru','Русский'],['en','English']].map(x=>`<button class="chip ${S.lang===x[0]?'on':''}" data-a="lang" data-l="${x[0]}">${x[1]}</button>`).join('')}</div></div>
<div class="item"><div class="ic">📁</div><div><b>Скачанные PDF</b><div class="h" id="pdfs">… файлов</div></div><button class="ln" data-a="pclr" style="color:var(--hint)">Очистить</button></div>
<div class="item" data-a="okey"><div class="ic">🔑</div><div><b>Ключ OpenAlex (необязательно)</b><div class="h">${S.oaKey||OA_KEY?'Задан':'Не задан'}</div></div>›</div>
<div class="item" data-a="prx"><div class="ic">🌐</div><div><b>Прокси для грантов (необязательно)</b><div class="h">${S.proxy||GRANT_PROXY?'Задан':'Не задан'}</div></div>›</div>
<div class="item"><div class="ic">🔒</div><div><b>Замок приложения</b><div class="h">PIN-код при открытии Scinode</div></div><input type="checkbox" class="sw" id="lk" ${S.lock?'checked':''}></div>
<div style="padding:8px 16px"><button class="gh w" data-a="logout">⎋ Выйти</button><button class="ln w" data-a="wipe" style="color:#b3261e;margin-top:12px">🗑 Удалить мои данные</button><button class="ln w" data-a="priv" style="margin-top:6px">ⓘ Политика конфиденциальности</button><p class="h" style="margin-top:14px;font-size:12px">Данные о статьях и учёных предоставляют открытые источники, в том числе OpenAlex.<br>Версия 0.4.0</p></div>`},
sci:()=>`<div class="row" style="padding:12px 16px"><button class="x" data-a="go" data-v="prof" style="font-size:24px;color:var(--tx)">←</button><h2 style="margin:0 0 0 12px;font-size:20px">Мой профиль учёного</h2></div><div style="padding:0 16px 30px"><button class="ct w" data-a="orcid" style="border-radius:14px">🪪 Заполнить профиль по ORCID</button>
<label class="lb">Имя</label><input id="s_name" value="${esc(S.name)}"><label class="lb">Статус</label><select id="s_status"><option value="">—</option>${STAT.map(x=>`<option ${S.status===x?'selected':''}>${x}</option>`).join('')}</select><label class="lb">Организация</label><input id="s_aff" value="${esc(S.aff)}"><label class="lb">Страна</label><button class="gh w" data-a="scc" style="text-align:left;color:var(--tx)">${CC[S.country]||'Выбрать страну'}</button><label class="lb">О себе</label><textarea id="s_bio" maxlength="400" style="min-height:90px">${esc(S.bio)}</textarea><label class="lb">ORCID</label><input id="s_orcid" value="${esc(S.orcid)}" placeholder="0000-0000-0000-0000">
<h2>Научные направления (до 5)</h2><div class="row" style="flex-wrap:wrap">${(S.dirs||[]).map((d,i)=>`<span class="chip">${esc(d.name)} <span data-a="rmd" data-i="${i}" style="margin-left:6px">✕</span></span>`).join('')}</div><button class="gh w" data-a="adddir" style="margin-top:10px">＋ Добавить направления</button>
<h2>Публикации в OpenAlex</h2><p class="h">Найдите себя среди авторов, чтобы подтянуть направления из публикаций</p><button class="gh w" data-a="oalink" style="margin-top:8px">🔗 ${S.oaAuthor?'Привязано: '+esc(S.oaAuthor.name):'Привязать к автору OpenAlex'}</button>
<div class="item" style="margin:16px 0"><div><b>Показывать мой профиль другим учёным</b><div class="h" style="font-size:12px">Публикуются: имя, статус, организация, страна, направления, «о себе», ORCID. E-mail и фото не публикуются.</div></div><input type="checkbox" class="sw" id="pub" ${S.pub?'checked':''}></div><button class="w" data-a="ssave" style="padding:14px">Сохранить</button></div>`};
const pcnt=()=>Math.round(['name','email','aff','orcid','bio','country','status'].filter(k=>S[k]).concat((S.dirs||[]).length?['d']:[]).length/8*100);

function resHtml(){if(!Q.items.length)return Q.busy?'<div class="spin">Загрузка…</div>':Q.err?'<div class="empty">Не удалось загрузить данные. Проверьте ключ OpenAlex в профиле и соединение.</div>':Q.q?'<div class="empty">Ничего не найдено.</div>':`<div class="empty"><div class="ic">🔎</div>Ищите среди сотен миллионов научных работ открытой базы OpenAlex<div style="text-align:left;margin-top:22px"><b style="color:var(--tx)">Попробуйте</b><div class="row" style="flex-wrap:wrap;margin-top:10px">${['machine learning','CRISPR','graphene','climate change','quantum computing','Alzheimer'].map(s=>`<button class="chip" data-a="sug" data-s="${s}">${s}</button>`).join('')}</div></div></div>`;
 return `<div class="p" style="padding-bottom:0"><b>Найдено: ${Q.total}</b></div>`+Q.items.map(w=>wcard(w)).join('')+(Q.busy?'<div class="spin">Загрузка…</div>':Q.items.length<Q.total&&Q.page<20?'<div style="padding:8px 16px"><button class="gh w" data-a="more">Показать ещё</button></div>':'')}
function netHtml(){if(N.busy)return'<div class="spin"><div style="font-size:30px">⏳</div>Загрузка…</div>';if(!N.res)return'';if(!N.res.length)return'<div class="empty">Никого не найдено.</div>';
 return `<div class="p" style="padding-bottom:0"><b>Найдено: ${N.res.length}</b></div>`+N.res.map((a,i)=>`<div class="card" data-a="aopen" data-i="${i}"><div class="row"><div class="av">${esc(a.n.split(' ').map(s=>s[0]).slice(0,2).join(''))}</div><div style="flex:1"><div class="t">${esc(a.n)}</div><div class="m">${esc([a.i,CC[a.cc]||a.cc].filter(Boolean).join(' · '))}</div></div></div><div>${a.c!=null?`<span class="tag">Работ по теме: ${a.c}</span>`:''}${a.h!=null?`<span class="tag">h-индекс: ${a.h}</span>`:''}<span class="tag">❝ Цитирований: ${fmt(a.q)}</span></div></div>`).join('')}
const GS={eu:'EU Funding & Tenders',gg:'Grants.gov'};

 if(!LF)LF=loadJS('https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js','https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css').then(()=>Promise.all([loadJS('https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js','https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css')]));
 await LF;if(cur!=='map'||!window.L){const l=$('#ml');if(l)l.textContent='Не удалось загрузить карту';return}
 MP=L.map('map',{zoomControl:false}).setView([35,50],3);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© Участники OpenStreetMap · Данные: OpenAlex'}).addTo(MP);mapLoad()}
const IS='id,display_name,type,geo,works_count,cited_by_count,summary_stats,homepage_url';
async function mapLoad(){const l=$('#ml')||(()=>{$('#main').insertAdjacentHTML('beforeend','<div class="spin" id="ml" style="position:absolute;top:50%;left:0;right:0;z-index:1000">Загрузка…</div>');return $('#ml')})();l.textContent='Загрузка организаций…';let list=[];
 try{if(M.sf){const f=['primary_topic.'+M.sf.type+'.id:'+M.sf.id];if(M.cc)f.push('authorships.institutions.country_code:'+M.cc);const g=await api('works?filter='+f.join(',')+'&group_by=authorships.institutions.id&per-page=200'),ids=g.group_by.filter(x=>x.key!=='unknown').map(x=>x.key.split('/').pop()),ch=[];for(let i=0;i<ids.length;i+=50)ch.push(ids.slice(i,i+50));(await Promise.all(ch.map(c=>api('institutions?filter=openalex:'+c.join('|')+'&per-page=50&select='+IS)))).forEach(r=>list=list.concat(r.results))}
  else{const base=M.cc?'institutions?filter=country_code:'+M.cc+'&sort=works_count:desc':'institutions?sort=works_count:desc';(await Promise.all([1,2].map(p=>api(base+'&per-page=200&page='+p+'&select='+IS)))).forEach(r=>list=list.concat(r.results))}}catch(e){l.remove();if(!keyErr(e))toast('Не удалось загрузить данные');return}
 l.remove();if(cur!=='map'||!MP)return;if(MP._cl)MP.removeLayer(MP._cl);
 const cl=L.markerClusterGroup({maxClusterRadius:50,chunkedLoading:true,iconCreateFunction:c=>L.divIcon({html:'<div class="mc">'+c.getChildCount()+'</div>',className:'',iconSize:[40,40]})}),pts=[];
 list.forEach(i=>{const g=i.geo||{};if(g.latitude==null)return;const ty=IT[i.type]||IT.other;pts.push([g.latitude,g.longitude]);L.circleMarker([g.latitude,g.longitude],{radius:6+Math.min(11,Math.log10((i.works_count||0)+1)*2.6),color:'#fff',weight:1.5,fillColor:ty[1],fillOpacity:.92}).on('click',()=>isheet(i)).addTo(cl)});
 MP.addLayer(cl);MP._cl=cl;if(pts.length)MP.fitBounds(pts,{padding:[30,30],maxZoom:M.cc?7:4});else toast('Организации не найдены')}
async function isheet(i){const ty=IT[i.type]||IT.other,g=i.geo||{};const m=sheet(`<div class="row"><i style="width:11px;height:11px;border-radius:50%;background:${ty[1]}"></i><span class="h">${ty[0]}</span></div><h2 style="font-size:22px;margin:6px 0">${esc(i.display_name)}</h2><div class="h">${esc([g.city,CC[g.country_code]||g.country_code].filter(Boolean).join(', '))}</div><div class="row" style="flex-wrap:wrap;margin:12px 0"><span class="chip">Работ: ${fmt(i.works_count)}</span><span class="chip">❝ Цитирований: ${fmt(i.cited_by_count)}</span><span class="chip">h-индекс: ${(i.summary_stats||{}).h_index||0}</span></div><b>Ведущие авторы за 5 лет</b><div id="ia"><div class="spin">Загрузка…</div></div><div id="ip"></div><button class="w" data-s="pt" style="margin-top:12px;padding:15px">✳ Показать партнёров</button><button class="gh w" data-s="oa" style="margin-top:10px">↗ Профиль в OpenAlex</button>${i.homepage_url?'<button class="gh w" data-s="hp" style="margin-top:10px">🌐 Сайт организации</button>':''}`,async e=>{const b=e.target.closest('[data-s]');if(!b)return;const s=b.dataset.s;if(s==='oa')openU(i.id);else if(s==='hp')openU(i.homepage_url);else if(s==='pt'){b.disabled=true;b.textContent='Загрузка…';try{const d=await api('works?filter=authorships.institutions.id:'+i.id.split('/').pop()+'&group_by=authorships.institutions.id&per-page=12'),p=d.group_by.filter(x=>x.key!==i.id&&x.key!=='unknown').slice(0,10);$('#ip').innerHTML='<h2>Партнёры (совместные работы)</h2>'+p.map(x=>`<div class="opt"><span>${esc(x.key_display_name)}</span><span class="tag">${x.count}</span></div>`).join('');b.remove()}catch(x){b.disabled=false;b.textContent='✳ Показать партнёров'}}});
 try{const d=await api('works?filter=authorships.institutions.id:'+i.id.split('/').pop()+',from_publication_date:'+(new Date().getFullYear()-5)+'-01-01&group_by=authorships.author.id&per-page=8'),a=d.group_by.filter(x=>x.key!=='unknown').slice(0,5),e=$('#ia');if(e)e.innerHTML=a.map(x=>`<div class="opt"><span>${esc(x.key_display_name)}</span><span class="tag">${x.count}</span></div>`).join('')||'<div class="h">Нет данных</div>'}catch(x){const e=$('#ia');if(e)e.textContent=''}}

function insert(s){const b=$('#nb');if(!b)return;const k=s.indexOf('|'),x=s.replace('|',''),p=b.selectionStart;b.value=b.value.slice(0,p)+x+b.value.slice(b.selectionEnd);const c=p+(k<0?x.length:k);b.focus();b.setSelectionRange(c,c);curN.b=b.value;lp()}
function saveNote(){const n=curN;n.t=($('#nt')||{value:n.t}).value.trim();if($('#nb'))n.b=$('#nb').value;if(!n.t&&!n.b)return;if(!n.id){n.id=uid();n.ts=Date.now();NT.unshift(n)}else{const i=NT.findIndex(x=>x.id===n.id);NT[i]=n}save();hap();curN=null;prev=false;show('notes')}

const A={
go:b=>{let v=b.dataset.v;if(v==='me')v=MT;if(v==='proj')curP=null;if(v==='notes')curN=null;show(v)},stab:b=>show(b.dataset.v),uz:()=>{Q.uz=!Q.uz;show('search');Q.q&&doSearch(1)},jm:b=>{J.m=b.dataset.m;J.items=null;show('jr')},jgo:()=>jGo(),jmore:()=>jGo(true),openx:b=>openU(b.dataset.u),juz:()=>{J.uz=!J.uz;J.items=null;show('jr')},jdoaj:()=>{J.doaj=!J.doaj;J.items=null;show('jr')},jopen:b=>jsheet(J.items[+b.dataset.i]),

pstat:()=>{const b=bd();sheet('<h2 style="margin-top:0;font-size:18px">Статистика доски</h2>'+b.cols.map((c,i)=>`<div class="opt"><span>${esc(c)}</span><span class="tag">${b.tasks.filter(x=>x.col===i).length}</span></div>`).join('')+`<div class="h" style="margin-top:8px">Просрочено: ${b.tasks.filter(x=>x.col!==LASTC(b)&&x.due&&dleft(x.due)<0).length}</div>`)},pflt:()=>{PF=PF?0:1;show('proj');toast(PF?'Только задачи со сроком':'Все задачи')},pset:()=>{const b=bd();modal('Доска',[{id:'n',l:'Название',v:b.name}],o=>{if(o.n){b.name=o.n;save();show('proj')}},()=>{PR=PR.filter(p=>p!==b);save();curP=null;show('proj')})},
nmenu:()=>{if(!curN.id){curN=null;show('notes');return}const go=()=>{NT=NT.filter(x=>x.id!==curN.id);save();curN=null;show('notes')};inTG&&tg.showConfirm?tg.showConfirm('Удалить заметку?',ok=>ok&&go()):confirm('Удалить заметку?')&&go()},
priv:()=>sheet('<h2 style="margin-top:0;font-size:18px">Политика конфиденциальности</h2><p style="font-size:14px">Профиль, задачи, заметки, библиотека, скачанные PDF и ключ OpenAlex хранятся только на вашем устройстве. Запросы отправляются в OpenAlex, Grants.gov, EU Funding &amp; Tenders, Zotero и ORCID только когда вы сами запускаете поиск или импорт. Кнопка «Удалить мои данные» стирает всё с устройства.</p>'),accept,dosearch:()=>doSearch(1),more:()=>doSearch(0),op:b=>openU(b.dataset.u),
key2:()=>askKey(),

sug:b=>{show('search');$('#q').value=b.dataset.s;doSearch(1)},
wopen:b=>{const id=b.dataset.id,w=(b.dataset.l==='1'?LIB:Q.items).find(x=>x.id===id)||LIB.find(x=>x.id===id);w&&wsheet(w)},
zot:()=>zImport(),

aopen:b=>asheet(N.res[+b.dataset.i]),mine:()=>asheet({id:S.oaAuthor?S.oaAuthor.id:'https://openalex.org',n:S.name,i:S.aff,cc:S.country,q:0,tp:(S.dirs||[]).map(d=>d.name),orcid:S.orcid?'https://orcid.org/'+S.orcid:''}),
gtab:b=>{G.tab=b.dataset.m;G.items=null;show('grants')},gsearch:gSearch,gsrc:b=>{G[b.dataset.s]=!G[b.dataset.s];$('#gres').innerHTML=grHtml()},gmore:()=>{G.n+=20;$('#gres').innerHTML=grHtml()},gopen:b=>gsheet(G.items[+b.dataset.i]),
goal:()=>modal('Цель недели (задач)',[{id:'g',l:'Количество',v:S.goal||5,t:'number'}],o=>{S.goal=Math.max(1,+o.g||5);save();show('home')}),
pback:()=>{curP=null;show('proj')},openp:b=>{if(b.dataset.id){curP=b.dataset.id;pi=0;show('proj')}},
rmp:(b,e)=>{e.stopPropagation();const id=b.dataset.id;const go=()=>{PR=PR.filter(p=>p.id!==id);save();show('proj')};inTG&&tg.showConfirm?tg.showConfirm('Удалить доску?',ok=>ok&&go()):confirm('Удалить доску?')&&go()},

tadd:b=>taskModal(bd(),+b.dataset.c),tedit:b=>{const x=bd().tasks.find(y=>y.id===b.dataset.id);taskModal(bd(),x.col,x)},
tmv:b=>{const bb=bd(),x=bb.tasks.find(y=>y.id===b.dataset.id);x.col++;if(x.col===LASTC(bb)){x.doneAt=Date.now();hap()}save();show('proj')},
